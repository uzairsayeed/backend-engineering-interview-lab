[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "tiny-url-api"
version = "2.0.0"
description = "An in-memory TinyURL HTTP API built with FastAPI."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
]


[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"